version: 2

project_name: gitmd

builds:
  - id: gitmd
    main: ./cmd/gitmd
    binary: gitmd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: gitmd
    ids: [gitmd]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: checksums.txt

nix:
  - name: gitmd
    ids: [gitmd]
    repository:
      owner: flaticols
      name: gitmd
      branch: latest
    commit_author:
      name: Denis Panfilov
      email: gh@flaticols.dev
    commit_msg_template: "nix: update gitmd to {{ .Tag }}"
    homepage: "https://github.com/flaticols/gitmd"
    description: "Manage git commit trailers (Reason, Ticket, Assisted, …) for git 2.54+"
    license: "mit"
    path: nix/gitmd.nix

release:
  github:
    owner: flaticols
    name: gitmd

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
