name: CI

on:
  pull_request:
  push:
    branches:
      - latest
    paths-ignore:
      - "README.md"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          # Compile the linter with the workflow's Go (matches go.mod, 1.26).
          # Required while no v2.x release is shipped built with Go 1.26 —
          # binary mode would fail with "Go language version used to build
          # golangci-lint is lower than the targeted Go version".
          install-mode: goinstall

      - name: Run tests
        run: go test -v ./...

      - name: Run build
        run: go build -v ./...
